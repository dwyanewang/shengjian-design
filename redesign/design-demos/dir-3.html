<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>声剪 方向 3：竖着的声音</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&display=swap" rel="stylesheet">
<style>
:root {
  --board: #080c15; --bg: #0e1420; --s1: #151d2b; --s2: #1c2637; --s3: #273349; --line: #263043;
  --t1: #eef2f8; --t2: #b7c1d1; --t3: #8d99ad;
  --glow: #7ef0cf; --glow-a: rgba(126, 240, 207, .14);
  --warm: #ffb648; --warm-ink: #2a1700; --warm-a: rgba(255, 182, 72, .16);
  --vip: #ecd9a4; --vip-bg: #2e2818; --red: #ff9384;
  --f-ui: "Geist", "Noto Sans CJK SC", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
  --f-disp: "Noto Serif CJK SC", "Noto Serif SC", "Source Han Serif SC", "Songti SC", serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { background: var(--board); }
body { color: var(--t1); font-family: var(--f-ui); font-size: 15px; line-height: 1.6; -webkit-font-smoothing: antialiased; font-synthesis: none; line-break: strict; overflow-x: hidden; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; -webkit-tap-highlight-color: transparent; }
input, textarea { font: inherit; color: inherit; background: none; border: 0; outline: none; }
.num { font-variant-numeric: tabular-nums; }

/* ---------------- board ---------------- */
.board { position: relative; width: 1600px; margin: 0 auto; padding: 0 56px 140px; }
.band { display: grid; grid-template-columns: 380px 494px 380px; column-gap: 117px; padding-top: 64px; }
.colL, .colC, .colR { display: flex; flex-direction: column; }
.mast { padding-top: 4px; }
.mast .mark { display: flex; align-items: center; gap: 18px; }
.mast h1 { font-family: var(--f-disp); font-weight: 900; font-size: 92px; line-height: 1; letter-spacing: -0.01em; color: var(--t1); }
.mast .dir { margin-top: 18px; font-size: 15px; color: var(--t3); }
.mast .lead { margin-top: 26px; font-size: 30px; line-height: 1.35; font-weight: 600; color: var(--t1); text-wrap: balance; }
.mast .lead em { font-style: normal; color: var(--glow); }
.mast p { margin-top: 18px; font-size: 16px; line-height: 1.8; color: var(--t2); text-wrap: pretty; }
.facts { margin-top: 26px; display: grid; gap: 14px; }
.facts div { display: grid; grid-template-columns: 10px 1fr; gap: 14px; font-size: 15px; line-height: 1.6; color: var(--t2); }
.facts div i { width: 6px; border-radius: 3px; background: var(--glow); margin: 5px 0 5px 2px; box-shadow: 0 0 8px rgba(126, 240, 207, .6); }
.facts div b { color: var(--t1); font-weight: 600; }
.plabel { margin: 0 0 14px; }
.plabel b { display: block; font-size: 17px; font-weight: 600; color: var(--t1); }
.plabel span { display: block; font-size: 14px; color: var(--t3); line-height: 1.55; margin-top: 2px; }
.pslot { position: relative; }
.pslot.flash::after { content: ''; position: absolute; inset: -10px; border-radius: 56px; box-shadow: 0 0 0 2px var(--warm), 0 0 40px rgba(255, 182, 72, .35); pointer-events: none; animation: flash 1.6s ease-out forwards; }
@keyframes flash { 0% { opacity: 0; } 15% { opacity: 1; } 100% { opacity: 0; } }

.zoom { margin-top: 18px; background: var(--bg); border-radius: 28px; padding: 20px 0 18px; box-shadow: 0 0 0 1px var(--line); position: relative; overflow: hidden; }
.zoom h3 { padding: 0 22px; font-size: 18px; font-weight: 600; }
.zoom .zsub { padding: 0 22px; margin-top: 2px; font-size: 14px; color: var(--t3); }
.zoom .stage { position: relative; margin-top: 12px; height: 318px; touch-action: none; cursor: ew-resize; user-select: none; }
.zoom .frames { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; padding: 14px 18px 0; }
.zoom .frames figure { display: flex; flex-direction: column; align-items: center; gap: 6px; }
.zoom .frames figcaption { font-size: 13px; color: var(--t2); text-align: center; line-height: 1.45; }
.zoom .again { position: absolute; right: 16px; top: 18px; font-size: 14px; color: var(--t2); padding: 4px 10px; border-radius: 14px; box-shadow: inset 0 0 0 1px var(--line); }

.gest { margin-top: 30px; }
.gest h3, .sec-h h2 { font-size: 20px; font-weight: 600; }
.gest .gsub { font-size: 14px; color: var(--t3); margin-top: 2px; }
.gest table { width: 100%; border-collapse: collapse; margin-top: 12px; }
.gest td { padding: 9px 0; vertical-align: top; border-top: 1px solid var(--line); font-size: 15px; line-height: 1.55; }
.gest td:first-child { width: 132px; color: var(--t1); font-weight: 600; padding-right: 12px; }
.gest td:last-child { color: var(--t2); }
.gest td small { display: block; font-size: 13px; color: var(--t3); }
.lose { margin-top: 22px; padding: 16px 18px; border-radius: 18px; background: var(--s1); }
.lose h4 { font-size: 16px; font-weight: 600; }
.lose p { margin-top: 6px; font-size: 14px; color: var(--t2); line-height: 1.7; }

.row3 { display: grid; grid-template-columns: repeat(3, 380px); justify-content: space-between; margin-top: 46px; }
.sec-h { margin-top: 120px; display: grid; grid-template-columns: 380px 1fr; column-gap: 117px; align-items: end; }
.sec-h p { font-size: 16px; color: var(--t2); line-height: 1.75; max-width: 760px; }
.sec-h h2 { font-size: 30px; line-height: 1.3; }

/* coverage map */
.cov { margin-top: 120px; }
.cov .top { display: grid; grid-template-columns: 380px 1fr; column-gap: 117px; align-items: end; }
.cov .top h2 { font-size: 30px; font-weight: 600; line-height: 1.3; }
.cov .top p { font-size: 15px; color: var(--t2); line-height: 1.75; }
.cov .filt { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 22px; }
.cov .filt button { height: 34px; padding: 0 14px; border-radius: 17px; font-size: 14px; color: var(--t2); box-shadow: inset 0 0 0 1px var(--line); }
.cov .filt button.on { background: var(--t1); color: var(--bg); box-shadow: none; font-weight: 600; }
.cov .grid { columns: 4; column-gap: 28px; margin-top: 26px; }
.cov .grp { break-inside: avoid; margin-bottom: 26px; }
.cov .grp h4 { display: flex; align-items: baseline; gap: 10px; font-size: 17px; font-weight: 600; padding-bottom: 8px; border-bottom: 1px solid var(--s3); }
.cov .grp h4 span { font-size: 14px; color: var(--t3); font-weight: 400; }
.cov .it { display: grid; grid-template-columns: 34px 1fr; gap: 4px; padding: 8px 6px; margin: 0 -6px; border-radius: 10px; font-size: 14px; line-height: 1.5; text-align: left; width: calc(100% + 12px); }
.cov .it.go:hover { background: var(--s1); }
.cov .it .id { color: var(--t3); font-variant-numeric: tabular-nums; }
.cov .it .nm { color: var(--t1); }
.cov .it .wh { display: block; color: var(--t3); font-size: 14px; margin-top: 2px; }
.cov .it .wh b { color: var(--glow); font-weight: 500; }
.cov .it.dim { opacity: .28; }

/* ---------------- phone ---------------- */
.ph { position: relative; width: 380px; height: 800px; padding: 10px; border-radius: 48px; background: #1a1f29; box-shadow: 0 0 0 1px rgba(255, 255, 255, .07), inset 0 0 0 1px rgba(255, 255, 255, .04), 0 40px 90px rgba(0, 0, 0, .55); }
.ph-scr { position: relative; width: 360px; height: 780px; border-radius: 38px; overflow: hidden; background: var(--bg); }
.ph-sb { position: absolute; top: 0; left: 0; right: 0; height: 32px; display: flex; align-items: center; justify-content: space-between; padding: 0 22px 0 28px; font-size: 13px; font-weight: 500; color: var(--t1); z-index: 60; cursor: s-resize; }
.ph-sb .ic { display: flex; align-items: center; gap: 6px; }
.ph-hole { position: absolute; top: 10px; left: 50%; width: 13px; height: 13px; margin-left: -6.5px; border-radius: 50%; background: #000; z-index: 61; box-shadow: 0 0 0 1.5px #121212; pointer-events: none; }
.ph-ct { position: absolute; top: 32px; left: 0; right: 0; bottom: 24px; overflow: hidden; }
.ph-nav { position: absolute; bottom: 0; left: 0; right: 0; height: 24px; display: flex; align-items: center; justify-content: center; z-index: 60; }
.ph-nav i { width: 100px; height: 4px; border-radius: 4px; background: rgba(238, 242, 248, .5); cursor: pointer; }

.scr { position: absolute; inset: 0; display: flex; flex-direction: column; background: var(--bg); }
.scr.enter { animation: scrIn .26s cubic-bezier(.2, .8, .2, 1); }
.scr.back { animation: scrBack .22s cubic-bezier(.2, .8, .2, 1); }
@keyframes scrIn { from { transform: translateX(28px); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes scrBack { from { transform: translateX(-20px); opacity: .4; } to { transform: none; opacity: 1; } }
.hdr { height: 52px; flex: none; display: flex; align-items: center; gap: 2px; padding: 0 6px; position: relative; z-index: 5; }
.ib { width: 44px; height: 44px; display: grid; place-items: center; border-radius: 22px; color: var(--t1); flex: none; position: relative; }
.ib:hover { background: rgba(255, 255, 255, .04); }
.ib:disabled { color: var(--s3); cursor: default; }
.hdr .tt { flex: 1; min-width: 0; padding: 0 4px; }
.hdr .tt b { display: block; font-size: 16px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.3; }
.hdr .tt > span { display: block; font-size: 13px; color: var(--t3); line-height: 1.35; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.body { flex: 1; overflow-y: auto; overflow-x: hidden; scrollbar-width: none; position: relative; }
.body::-webkit-scrollbar { display: none; }
.pad { padding: 0 16px; }
.h2 { font-size: 22px; font-weight: 600; line-height: 1.35; }
.st { font-size: 14px; color: var(--t3); font-weight: 500; margin: 22px 16px 8px; display: flex; align-items: baseline; justify-content: space-between; }
.st b { color: var(--t1); font-size: 16px; font-weight: 600; }
.note { font-size: 14px; color: var(--t3); line-height: 1.55; }
.t2 { color: var(--t2); } .t3 { color: var(--t3); } .gl { color: var(--glow); } .wm { color: var(--warm); }

.btn { height: 48px; padding: 0 20px; border-radius: 24px; background: var(--s2); color: var(--t1); font-size: 15px; font-weight: 600; display: inline-flex; align-items: center; justify-content: center; gap: 8px; white-space: nowrap; flex: none; }
.btn.pri { background: var(--warm); color: var(--warm-ink); }
.btn.full { width: 100%; }
.btn.sm { height: 38px; padding: 0 14px; font-size: 14px; border-radius: 19px; }
.btn.line { background: transparent; box-shadow: inset 0 0 0 1px var(--s3); }
.btn:disabled { opacity: .45; cursor: default; }
.chip { height: 36px; padding: 0 14px; border-radius: 18px; background: var(--s2); color: var(--t2); font-size: 14px; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; flex: none; }
.chip.on { background: var(--t1); color: var(--bg); font-weight: 600; }
.chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding: 0 16px; }
.chips::-webkit-scrollbar { display: none; }
.wrapchips { display: flex; flex-wrap: wrap; gap: 8px; }
.seg { display: flex; background: var(--s2); border-radius: 21px; padding: 3px; gap: 2px; }
.seg button { flex: 1; height: 36px; border-radius: 18px; font-size: 14px; color: var(--t2); white-space: nowrap; padding: 0 6px; }
.seg button.on { background: var(--t1); color: var(--bg); font-weight: 600; }
.sw { width: 46px; height: 28px; border-radius: 14px; background: var(--s3); position: relative; flex: none; transition: background .18s; }
.sw::after { content: ''; position: absolute; left: 4px; top: 4px; width: 20px; height: 20px; border-radius: 50%; background: var(--t2); transition: .18s; }
.sw.on { background: var(--t1); }
.sw.on::after { left: 22px; background: var(--bg); }
.vip { display: inline-block; font-size: 12px; line-height: 18px; font-weight: 700; color: var(--vip); background: var(--vip-bg); border-radius: 6px; padding: 0 6px; letter-spacing: .02em; vertical-align: 1px; }
.tag { display: inline-block; font-size: 12px; line-height: 20px; color: var(--t2); background: var(--s2); border-radius: 6px; padding: 0 7px; }

.li { display: flex; align-items: center; gap: 12px; padding: 10px 16px; min-height: 60px; width: 100%; text-align: left; position: relative; }
.li + .li::before { content: ''; position: absolute; left: 16px; right: 0; top: 0; height: 1px; background: var(--line); }
.li .lt { flex: 1; min-width: 0; }
.li .lt b { display: block; font-size: 15px; font-weight: 500; line-height: 1.4; color: var(--t1); }
.li .lt > span { display: block; font-size: 13px; color: var(--t3); line-height: 1.45; margin-top: 1px; }
.li .rt { font-size: 14px; color: var(--t2); flex: none; }

.scrim { position: absolute; inset: 0; background: rgba(3, 6, 11, .6); z-index: 30; animation: fade .2s; }
.sheet { position: absolute; left: 0; right: 0; bottom: 0; background: var(--s1); border-radius: 26px 26px 0 0; z-index: 31; max-height: 92%; display: flex; flex-direction: column; animation: up .28s cubic-bezier(.2, .8, .2, 1); }
.sheet .grab { width: 36px; height: 4px; border-radius: 2px; background: var(--s3); margin: 8px auto 2px; flex: none; }
.sheet .sh { display: flex; align-items: center; gap: 8px; padding: 6px 8px 6px 20px; flex: none; }
.sheet .sh b { flex: 1; font-size: 18px; font-weight: 600; }
.sheet .sb { overflow-y: auto; scrollbar-width: none; padding-bottom: 18px; }
.sheet .sb::-webkit-scrollbar { display: none; }
@keyframes up { from { transform: translateY(40px); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
.toast { position: absolute; left: 12px; right: 12px; bottom: 132px; z-index: 70; background: #e8edf5; color: #121826; border-radius: 16px; padding: 11px 8px 11px 16px; display: flex; align-items: center; gap: 10px; font-size: 14px; line-height: 1.45; box-shadow: 0 10px 30px rgba(0, 0, 0, .4); animation: up .22s; }
.toast span { flex: 1; }
.toast button { color: #8a4b00; font-weight: 700; padding: 6px 10px; border-radius: 10px; flex: none; }

.shade { position: absolute; left: 0; right: 0; top: 0; z-index: 80; background: rgba(10, 14, 22, .97); padding: 40px 12px 18px; border-radius: 0 0 26px 26px; animation: down .25s; box-shadow: 0 20px 50px rgba(0, 0, 0, .5); }
@keyframes down { from { transform: translateY(-30px); opacity: 0; } to { transform: none; opacity: 1; } }
.ntf { background: var(--s1); border-radius: 20px; padding: 12px 14px; margin-top: 8px; }
.ntf .nh { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--t3); }
.ntf .nh i { width: 14px; height: 14px; border-radius: 4px; background: var(--glow); display: inline-block; }
.ntf b { display: block; font-size: 15px; margin-top: 6px; font-weight: 600; }
.ntf p { font-size: 13.5px; color: var(--t2); }
.bar { height: 4px; border-radius: 2px; background: var(--s3); overflow: hidden; margin-top: 8px; }
.bar i { display: block; height: 100%; background: var(--glow); border-radius: 2px; }

/* spine */
.spv { position: relative; overflow-y: auto; overflow-x: hidden; scrollbar-width: none; touch-action: pan-y; user-select: none; -webkit-user-select: none; overscroll-behavior: contain; }
.spv::-webkit-scrollbar { display: none; }
.spv .tile { position: absolute; left: 0; filter: drop-shadow(0 0 4px rgba(126, 240, 207, .45)); pointer-events: none; }
.spv .ovl { position: absolute; left: 0; right: 0; top: 0; pointer-events: none; }
.spv .ovl > * { pointer-events: auto; }
.gut { position: absolute; left: 0; top: 0; width: 54px; touch-action: none; cursor: ns-resize; }
.tick { position: absolute; left: 0; width: 54px; pointer-events: none; }
.tick i { position: absolute; right: 4px; top: 0; width: 6px; height: 1px; background: var(--t3); opacity: .55; }
.tick.maj i { width: 12px; opacity: .9; }
.tick span { position: absolute; right: 18px; top: -9px; font-size: 12px; color: var(--t3); font-variant-numeric: tabular-nums; }
.phl { position: absolute; left: 0; right: 0; height: 1px; background: rgba(238, 242, 248, .9); pointer-events: none; z-index: 6; box-shadow: 0 0 6px rgba(238, 242, 248, .4); }
.phl b { position: absolute; left: 4px; top: -12px; height: 24px; padding: 0 8px; border-radius: 12px; background: var(--t1); color: var(--bg); font-size: 13px; font-weight: 700; line-height: 24px; font-variant-numeric: tabular-nums; }
.phl em { position: absolute; right: 8px; top: -11px; font-style: normal; font-size: 12px; color: var(--t2); background: var(--bg); padding: 0 6px; border-radius: 6px; line-height: 22px; }
.spfade { position: absolute; left: 0; right: 0; height: 28px; pointer-events: none; z-index: 4; }
.lbl { position: absolute; font-size: 13px; line-height: 18px; color: var(--t2); white-space: nowrap; transform: translateY(-50%); }
.lbl.gap { color: var(--t1); font-weight: 500; cursor: pointer; padding: 6px 8px; margin-left: -8px; border-radius: 10px; }
.lbl.gap small { font-size: 12px; color: var(--t3); font-weight: 400; margin-left: 4px; }
.lbl.gap.sel { color: var(--warm); background: var(--warm-a); }
.lbl.dim { color: var(--t3); font-size: 12px; }
.lead-l { position: absolute; height: 1px; background: repeating-linear-gradient(90deg, rgba(141, 153, 173, .55) 0 2px, transparent 2px 5px); pointer-events: none; }
.seam { position: absolute; height: 0; border-top: 1px dashed rgba(255, 182, 72, .7); pointer-events: none; }
.seam-l { position: absolute; transform: translateY(-50%); font-size: 12px; color: var(--t3); background: var(--bg); border-radius: 8px; padding: 2px 7px; white-space: nowrap; cursor: pointer; box-shadow: inset 0 0 0 1px var(--line); }
.seam-l.sel { color: var(--warm); box-shadow: inset 0 0 0 1px var(--warm); }
.mk { position: absolute; transform: translate(-50%, -50%); width: 13px; height: 13px; border-radius: 50%; background: var(--bg); box-shadow: 0 0 0 2px var(--t1); cursor: pointer; z-index: 3; }
.mk.sel { box-shadow: 0 0 0 2px var(--warm); }
.mk-l { position: absolute; transform: translateY(-50%); font-size: 13px; color: var(--t1); white-space: nowrap; cursor: pointer; background: var(--bg); padding: 1px 6px; border-radius: 6px; }
.mk-line { position: absolute; height: 1px; background: rgba(238, 242, 248, .35); pointer-events: none; }
.selb { position: absolute; left: 0; right: 0; background: var(--warm-a); box-shadow: inset 0 1px 0 var(--warm), inset 0 -1px 0 var(--warm); pointer-events: none; }
.selb span { position: absolute; right: 8px; top: 4px; font-size: 12.5px; font-weight: 600; color: var(--warm); background: var(--bg); border-radius: 8px; padding: 1px 7px; pointer-events: auto; cursor: pointer; }
.hdl { position: absolute; left: 22px; width: 22px; height: 22px; margin-top: -11px; border-radius: 11px; background: var(--warm); box-shadow: 0 0 0 4px rgba(14, 20, 32, .9); touch-action: none; cursor: ns-resize; z-index: 4; }
.hdl::after { content: ''; position: absolute; left: 6px; right: 6px; top: 10px; height: 2px; background: var(--warm-ink); border-radius: 1px; }
.strike { position: absolute; height: 3px; margin-top: -1.5px; border-radius: 2px; background: var(--warm); pointer-events: none; box-shadow: 0 0 10px rgba(255, 182, 72, .7); }
.ptag { position: absolute; width: 22px; height: 22px; margin-top: -11px; border-radius: 11px; background: var(--warm); color: var(--warm-ink); font-size: 13px; font-weight: 700; display: grid; place-items: center; pointer-events: none; font-variant-numeric: tabular-nums; }
.pband { position: absolute; left: 54px; right: 0; pointer-events: none; }
.hint { position: absolute; z-index: 7; width: 168px; background: var(--s3); color: var(--t1); box-shadow: inset 0 0 0 1px rgba(255,182,72,.5), 0 8px 24px rgba(0, 0, 0, .5); font-size: 13.5px; line-height: 1.45; font-weight: 500; border-radius: 14px; padding: 9px 12px; box-shadow: 0 8px 24px rgba(0, 0, 0, .5); }
.hint::before { content: ''; position: absolute; left: -6px; top: 50%; margin-top: -6px; border: 6px solid transparent; border-left: 0; border-right-color: var(--s3); }
.hint button { display: block; margin-top: 4px; color: var(--warm); font-weight: 700; font-size: 13px; }
.zpill { position: absolute; right: 8px; bottom: 10px; z-index: 6; opacity: 0; visibility: hidden; transition: opacity .2s, visibility .2s; display: flex; align-items: center; background: rgba(14, 20, 32, .88); border-radius: 16px; box-shadow: inset 0 0 0 1px var(--line); font-size: 12.5px; color: var(--t2); }
.zpill button { width: 30px; height: 30px; font-size: 16px; color: var(--t1); }
.zpill span { font-variant-numeric: tabular-nums; min-width: 64px; text-align: center; }

/* editor dock */
.dock { flex: none; padding: 8px 0 10px; background: var(--bg); position: relative; z-index: 5; box-shadow: 0 -1px 0 var(--line); }
.tools { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding: 0 10px; }
.tools::-webkit-scrollbar { display: none; }
.tool { flex: none; height: 44px; padding: 0 12px 0 10px; border-radius: 22px; display: inline-flex; align-items: center; gap: 6px; background: var(--s2); color: var(--t1); font-size: 14px; font-weight: 500; white-space: nowrap; }
.tool.pri { background: var(--warm); color: var(--warm-ink); font-weight: 600; }
.tool .bd { min-width: 20px; height: 20px; padding: 0 5px; border-radius: 10px; background: var(--s3); color: var(--t1); font-size: 12px; line-height: 20px; text-align: center; font-weight: 600; }
.tool.pri .bd { background: rgba(42, 23, 0, .18); color: var(--warm-ink); }
.say { display: flex; align-items: center; gap: 8px; padding: 8px 10px 0; }
.playb { width: 48px; height: 48px; border-radius: 24px; background: var(--t1); color: var(--bg); display: grid; place-items: center; flex: none; }
.sayf { flex: 1; height: 48px; border-radius: 24px; background: var(--s2); display: flex; align-items: center; padding: 0 6px 0 16px; gap: 6px; min-width: 0; cursor: text; }
.sayf span { flex: 1; font-size: 15px; color: var(--t3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: left; }
.sayf .ib { width: 38px; height: 38px; }
.spd { font-size: 13px; font-weight: 600; color: var(--t2); width: 40px; height: 48px; flex: none; font-variant-numeric: tabular-nums; }

/* panels in editor */
.panel { flex: none; background: var(--s1); border-radius: 22px 22px 0 0; position: relative; z-index: 6; display: flex; flex-direction: column; box-shadow: 0 -10px 30px rgba(0, 0, 0, .35); animation: up .26s cubic-bezier(.2, .8, .2, 1); }
.panel .ph-h { display: flex; align-items: center; gap: 8px; padding: 14px 10px 4px 18px; }
.panel .ph-h b { flex: 1; font-size: 18px; font-weight: 600; }
.step { display: grid; grid-template-columns: 26px 1fr auto; gap: 10px; align-items: start; padding: 7px 12px 7px 16px; position: relative; }
.step + .step::before { content: ''; position: absolute; left: 52px; right: 12px; top: 0; height: 1px; background: var(--line); }
.step .n { width: 24px; height: 24px; border-radius: 12px; background: var(--warm); color: var(--warm-ink); font-size: 13px; font-weight: 700; display: grid; place-items: center; margin-top: 1px; }
.step.off .n { background: var(--s3); color: var(--t3); }
.step.off .sx b { text-decoration: line-through; color: var(--t3); }
.step .sx b { font-size: 15px; font-weight: 600; line-height: 1.45; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.step .sx span { display: block; font-size: 13px; color: var(--t3); line-height: 1.45; margin-top: 1px; }
.val { display: inline-flex; align-items: center; height: 28px; border-radius: 14px; background: var(--s2); font-size: 14px; font-weight: 600; color: var(--t1); overflow: hidden; }
.val button { width: 28px; height: 28px; color: var(--t2); font-size: 16px; }
.val i { font-style: normal; padding: 0 2px; min-width: 46px; text-align: center; font-variant-numeric: tabular-nums; }
.said { margin: 2px 18px 4px; font-size: 14.5px; color: var(--t2); line-height: 1.6; }
.said sup { font-size: 12px; color: var(--warm); font-weight: 700; margin: 0 1px; vertical-align: 5px; }
.foot { display: flex; align-items: center; gap: 10px; padding: 10px 14px 12px; }
.foot .sum { flex: 1; font-size: 14px; color: var(--t2); line-height: 1.4; }
.foot .sum b { color: var(--t1); font-size: 16px; font-variant-numeric: tabular-nums; }

/* home */
.hero { margin: 4px 12px 0; border-radius: 26px; background: var(--s1); display: grid; grid-template-columns: 128px 1fr; overflow: hidden; position: relative; }
.hero .hs { position: relative; height: 236px; background: var(--bg); }
.hero .hx { padding: 16px 16px 14px 14px; display: flex; flex-direction: column; }
.hero .hx b { font-size: 16px; font-weight: 600; line-height: 1.4; }
.hero .hx .m { font-size: 13px; color: var(--t3); margin-top: 4px; }
.hero .hx .say1 { margin-top: auto; font-size: 13.5px; color: var(--t2); line-height: 1.5; }
.srcs { display: grid; grid-template-columns: repeat(5, 1fr); gap: 2px; padding: 0 8px; }
.srcs button { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 6px 0; font-size: 13px; color: var(--t2); }
.srcs button i { width: 52px; height: 52px; border-radius: 26px; background: var(--s2); display: grid; place-items: center; color: var(--t1); }
.srcs button.rec i { background: #3a1f1f; color: #ff8f7f; }
.lib-row { display: flex; align-items: center; gap: 12px; padding: 8px 16px; min-height: 76px; width: 100%; text-align: left; position: relative; }
.lib-row + .lib-row::before { content: ''; position: absolute; left: 52px; right: 0; top: 0; height: 1px; background: var(--line); }
.lib-row .thumb { width: 24px; height: 60px; flex: none; }
.lib-row .lt { flex: 1; min-width: 0; }
.lib-row .lt b { display: block; font-size: 15px; font-weight: 500; line-height: 1.4; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lib-row .lt > span { display: block; font-size: 13px; color: var(--t3); line-height: 1.45; margin-top: 2px; }
.lib-row .lt .stt { color: var(--warm); }
.lib-row .rt { font-size: 14px; color: var(--t2); font-variant-numeric: tabular-nums; flex: none; text-align: right; }
.lib-row.on { background: var(--warm-a); }
.ck { width: 24px; height: 24px; border-radius: 12px; box-shadow: inset 0 0 0 2px var(--t3); flex: none; display: grid; place-items: center; }
.ck.on { background: var(--warm); box-shadow: none; color: var(--warm-ink); }

/* record */
.recv { position: relative; flex: 1; overflow: hidden; }
.bigrec { width: 84px; height: 84px; border-radius: 42px; background: #ff7a6a; display: grid; place-items: center; box-shadow: 0 0 0 6px rgba(255, 122, 106, .18); color: #2b0a06; }
.bigrec.on { animation: pulse 1.6s infinite; }
@keyframes pulse { 0%, 100% { box-shadow: 0 0 0 6px rgba(255, 122, 106, .18); } 50% { box-shadow: 0 0 0 14px rgba(255, 122, 106, .08); } }

/* misc screens */
.card { background: var(--s1); border-radius: 22px; }
.opt { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; padding: 14px 16px; border-radius: 20px; background: var(--s1); box-shadow: inset 0 0 0 1px transparent; }
.opt.on { box-shadow: inset 0 0 0 1.5px var(--t1); background: var(--s2); }
.opt .lt b { display: block; font-size: 16px; font-weight: 600; }
.opt .lt > span { display: block; font-size: 13px; color: var(--t3); margin-top: 2px; line-height: 1.45; }
.opt .lt { flex: 1; }
.radio { width: 22px; height: 22px; border-radius: 11px; box-shadow: inset 0 0 0 2px var(--t3); flex: none; }
.radio.on { box-shadow: inset 0 0 0 7px var(--t1); }
.fld { display: flex; align-items: center; gap: 10px; min-height: 48px; padding: 0 14px; border-radius: 14px; background: var(--s2); font-size: 15px; }
.fld input { flex: 1; min-width: 0; }
.fld label { color: var(--t3); font-size: 14px; flex: none; width: 44px; }
.ta { width: 100%; min-height: 104px; padding: 14px 16px; border-radius: 18px; background: var(--s1); font-size: 16px; line-height: 1.7; resize: none; color: var(--t1); }
.slider { position: relative; height: 36px; touch-action: none; cursor: pointer; }
.slider .tr { position: absolute; left: 0; right: 0; top: 16px; height: 4px; border-radius: 2px; background: var(--s3); }
.slider .fl { position: absolute; left: 0; top: 16px; height: 4px; border-radius: 2px; background: var(--t1); }
.slider .kb { position: absolute; top: 7px; width: 22px; height: 22px; margin-left: -11px; border-radius: 11px; background: var(--t1); box-shadow: 0 2px 6px rgba(0, 0, 0, .4); }
.kv { display: flex; align-items: center; justify-content: space-between; gap: 12px; font-size: 15px; padding: 10px 0; }
.kv span { color: var(--t3); font-size: 14px; }
.gate { margin: 0 12px; padding: 14px 16px; border-radius: 20px; background: var(--vip-bg); }
.gate b { display: block; font-size: 15px; color: var(--vip); }
.gate p { font-size: 13.5px; color: var(--t2); margin-top: 2px; line-height: 1.5; }
.warn { display: flex; gap: 10px; align-items: center; padding: 12px 14px; border-radius: 16px; background: var(--s1); font-size: 14px; line-height: 1.5; }
.warn i { width: 8px; height: 8px; border-radius: 4px; background: var(--warm); flex: none; }
.vrow { display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-radius: 18px; width: 100%; text-align: left; }
.vrow.on { background: var(--s2); box-shadow: inset 0 0 0 1.5px var(--t1); }
.vrow .lt { flex: 1; min-width: 0; }
.vrow .lt b { font-size: 15px; font-weight: 600; }
.vrow .lt > span { display: block; font-size: 13px; color: var(--t3); line-height: 1.45; }
.playsm { width: 36px; height: 36px; border-radius: 18px; background: var(--s2); display: grid; place-items: center; flex: none; color: var(--t1); }
.playsm.on { background: var(--t1); color: var(--bg); }
.mic-bars { display: flex; align-items: center; justify-content: center; gap: 5px; height: 70px; }
.mic-bars i { width: 6px; border-radius: 3px; background: var(--glow); animation: mb 0.9s ease-in-out infinite; box-shadow: 0 0 8px rgba(126, 240, 207, .5); }
@keyframes mb { 0%, 100% { height: 10px; } 50% { height: 56px; } }
.spin { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--s3); border-top-color: var(--t1); animation: rot .8s linear infinite; flex: none; }
@keyframes rot { to { transform: rotate(360deg); } }
.ghost-fing { position: absolute; width: 30px; height: 30px; border-radius: 15px; background: rgba(238, 242, 248, .28); box-shadow: 0 0 0 2px rgba(238, 242, 248, .6); pointer-events: none; }

/* narrow screens: stack everything, scale phones */
.board.narrow { width: 100%; padding: 0 16px 80px; }
.board.narrow .band, .board.narrow .row3, .board.narrow .sec-h, .board.narrow .cov .top { display: block; }
.board.narrow .colL, .board.narrow .colC, .board.narrow .colR { margin-top: 40px; align-items: stretch; }
.board.narrow .mast h1 { font-size: 64px; }
.board.narrow .mast .lead { font-size: 24px; }
.board.narrow .row3 > * { margin-top: 40px; }
.board.narrow .cov .grid { columns: 1; }
.board.narrow .sec-h h2, .board.narrow .cov .top h2 { font-size: 24px; margin-bottom: 10px; }
.board.narrow .zoom, .board.narrow .gest, .board.narrow .lose { max-width: 100%; }

@keyframes swipeHint { 0% { left: 60px; opacity: 0; } 15% { opacity: 1; } 70% { left: 290px; opacity: 1; } 85%, 100% { left: 300px; opacity: 0; } }
span.vip, span.tag { display: inline-block; width: auto; margin-top: 0; }
.spwrap:hover .zpill, .zpill.show { opacity: 1; visibility: visible; }

</style>
