<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>声剪 · 一个字一件事</title>
<!--
  声剪 · 方向 2「一个字一件事」 初稿（2026-11-23）
  设计系统：
  - 三色：刃蓝 #2B3BFF（品牌、正在做的那件事、该点的地方）、墨 #000（字、声音、会员）、纸 #FFF。浅蓝 #EDEFFF 只是刃蓝的 8% 铺底。
    声音不另设功能色：白底上用墨画，蓝底上用白画。
  - 标志：刃蓝方块里一个白色「剪」，右上角斜着剪掉一刀。剪角只给标志和「正在做的那件事」的角标。
  - 字：Noto Sans SC 900 做巨字与标题（裁切、贴边，像印章不像标题），Schibsted Grotesk 接住拉丁字母与数字（时间用等宽数字）。
  - 汉字方块 = 图标 = 入口 = 流程身份。流程开头半屏巨字只做一步，开始干活后巨字缩成左上角的角标。
  - 零圆角（剪出来的边是直的），一屏只有一个刃蓝主按钮。
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&family=Schibsted+Grotesk:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --blue:#2B3BFF; --blue-d:#1F2BD6; --ink:#000; --paper:#fff; --tint:#EDEFFF; --tint2:#DCE0FF;
  --mute:#4B4F5E; --line:rgba(0,0,0,.16); --hair:rgba(0,0,0,.08); --onblue:rgba(255,255,255,.86);
  --f:"Schibsted Grotesk","Noto Sans SC","Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif;
  --han:"Noto Sans SC","Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--blue);color:#fff;font-family:var(--f);font-synthesis:none;line-break:strict;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:center}
input,textarea{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes down{from{transform:translateY(-100%)}to{transform:none}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes flash{0%{box-shadow:0 0 0 0 rgba(255,255,255,0)}30%{box-shadow:0 0 0 10px #fff}100%{box-shadow:0 0 0 0 rgba(255,255,255,0)}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}

/* ---------- 汉字方块 ---------- */
.han{display:inline-flex;align-items:center;justify-content:center;font-family:var(--han);font-weight:900;line-height:1;flex:none;letter-spacing:0;user-select:none}
.han-blue{background:var(--blue);color:#fff}
.han-ink{background:#000;color:#fff}
.han-tint{background:var(--tint);color:#000}
.han-tintb{background:var(--tint);color:var(--blue)}
.han-white{background:#fff;color:var(--blue)}
.han-line{background:#fff;color:#000;box-shadow:inset 0 0 0 2px #000}
.han-ghost{background:transparent;color:#fff;box-shadow:inset 0 0 0 2px rgba(255,255,255,.9)}

/* ---------- 手机外壳（Android，参考 android_frame.jsx） ---------- */
.pf{display:inline-block;padding:9px;background:#161616;border-radius:46px;box-shadow:0 0 0 1.5px #2e2e2e,0 30px 70px rgba(0,0,20,.32);position:relative;vertical-align:top}
.pf.flash{animation:flash 1.1s ease-out}
.pf-scr{position:relative;width:360px;height:780px;border-radius:37px;overflow:hidden;background:#fff;color:#000;isolation:isolate;text-align:left}
.pf-st{position:absolute;top:0;left:0;right:0;height:32px;display:flex;align-items:center;justify-content:space-between;padding:0 22px 0 26px;font:600 14px/1 var(--f);color:#000;z-index:70;cursor:pointer;transition:color .3s}
.pf-st.lt{color:#fff}
.pf-st .ic{display:flex;align-items:center;gap:5px}
.pf-hole{position:absolute;top:10px;left:50%;width:13px;height:13px;margin-left:-6.5px;border-radius:50%;background:#000;z-index:71;pointer-events:none}
.pf-gb{position:absolute;bottom:0;left:0;right:0;height:24px;display:flex;align-items:center;justify-content:center;z-index:70;cursor:pointer}
.pf-gb i{width:108px;height:4px;border-radius:4px;background:rgba(0,0,0,.42)}
.pf-gb.lt i{background:rgba(255,255,255,.7)}

/* ---------- 手机里的页面 ---------- */
.pr{position:absolute;inset:0;display:flex;flex-direction:column;background:#fff;color:#000;padding-top:32px;overflow:hidden}
.pr.np{padding-top:0}
.ps{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:none}
.ps::-webkit-scrollbar{display:none}
.pbar{height:52px;flex:none;display:flex;align-items:center;gap:6px;padding:0 8px 0 4px}
.pbar .grow{flex:1;min-width:0}
.pib{width:44px;height:44px;display:inline-flex;align-items:center;justify-content:center;flex:none}
.pt0{font:900 30px/1.2 var(--f);letter-spacing:0}
.pt1{font:900 25px/1.25 var(--f)}
.pt2{font:800 20px/1.3 var(--f)}
.pt3{font:700 17px/1.35 var(--f)}
.pbody{font:400 16px/1.65 var(--f)}
.psub{font:400 14px/1.5 var(--f);color:var(--mute)}
.psm{font:500 12px/1.35 var(--f);color:var(--mute)}
.pk{font:700 14px/1.2 var(--f);color:var(--mute)}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pad{padding-left:16px;padding-right:16px}
.pbtn{height:56px;width:100%;display:flex;align-items:center;justify-content:center;gap:8px;background:var(--blue);color:#fff;font:800 18px/1 var(--f);flex:none}
.pbtn:active{background:var(--blue-d)}
.pbtn.ink{background:#000}
.pbtn.line{background:#fff;color:#000;box-shadow:inset 0 0 0 2px #000}
.pbtn.ghost{background:var(--tint);color:#000}
.pbtn.sm{height:46px;font-size:16px}
.pbtn.wl{background:#fff;color:var(--blue)}
.pbtn2{display:flex;gap:8px}
.pbtn2>*{flex:1}
.plink{color:var(--blue);font:700 15px/1.4 var(--f);padding:8px 0;display:inline-flex;align-items:center;gap:4px}
.pfoot{flex:none;padding:12px 16px 34px;background:#fff;position:relative;z-index:5}
.pfoot .note{font:400 13px/1.45 var(--f);color:var(--mute);text-align:center;margin-top:8px}
.prow{display:flex;align-items:center;gap:12px;padding:10px 16px;min-height:64px;cursor:pointer;text-align:left;width:100%;position:relative}
.prow + .prow{box-shadow:0 -1px 0 var(--hair)}
.prow .mid{flex:1;min-width:0}
.prow.on{background:var(--tint)}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:0 16px}
.chips::-webkit-scrollbar{display:none}
.chip{display:inline-flex;align-items:center;gap:6px;height:38px;padding:0 14px;font:600 15px/1 var(--f);background:var(--tint);color:#000;flex:none;white-space:nowrap}
.chip.on{background:#000;color:#fff}
.chip.b{background:var(--blue);color:#fff}
.tag{display:inline-flex;align-items:center;height:22px;padding:0 7px;font:800 12px/1 var(--f);background:#000;color:#fff;flex:none;white-space:nowrap}
.tag.b{background:var(--blue)}
.tag.t{background:var(--tint);color:var(--blue)}
.tag.o{background:transparent;color:#000;box-shadow:inset 0 0 0 1.5px #000}
.seg{display:flex;background:var(--tint);padding:3px;gap:3px}
.seg button{flex:1;min-height:44px;font:700 15px/1.2 var(--f);color:#000;padding:0 4px}
.seg button.on{background:#000;color:#fff}
.tog{width:50px;height:30px;background:#BFC3D3;position:relative;flex:none;transition:background .18s}
.tog i{position:absolute;top:4px;left:4px;width:22px;height:22px;background:#fff;transition:left .18s}
.tog.on{background:var(--blue)}
.tog.on i{left:24px}
.check{width:26px;height:26px;flex:none;box-shadow:inset 0 0 0 2px #000;display:inline-flex;align-items:center;justify-content:center;background:#fff}
.check.on{background:var(--blue);box-shadow:none;color:#fff}
.radio{width:24px;height:24px;flex:none;border-radius:50%;box-shadow:inset 0 0 0 2px #000;position:relative}
.radio.on{box-shadow:inset 0 0 0 2px var(--blue)}
.radio.on::after{content:"";position:absolute;inset:5px;border-radius:50%;background:var(--blue)}
.field{background:var(--tint);padding:14px 14px;font:400 17px/1.6 var(--f);width:100%;border:0;outline:none;resize:none;color:#000;display:block}
.field:focus{box-shadow:inset 0 0 0 2px var(--blue)}
.sect{padding:20px 16px 8px;display:flex;align-items:baseline;gap:8px}
.sect b{font:800 16px/1.3 var(--f)}
.sect span{font:400 14px/1.3 var(--f);color:var(--mute)}
.bar-prog{height:6px;background:var(--tint);position:relative;overflow:hidden}
.bar-prog i{position:absolute;left:0;top:0;bottom:0;background:var(--blue);transition:width .3s}
.slider{position:relative;height:36px;display:flex;align-items:center;cursor:pointer}
.slider .tr{position:absolute;left:0;right:0;height:4px;background:var(--tint2)}
.slider .fi{position:absolute;left:0;height:4px;background:var(--blue)}
.slider .kn{position:absolute;width:22px;height:22px;margin-left:-11px;background:#fff;box-shadow:inset 0 0 0 3px var(--blue)}

/* 底部弹层、提示 */
.shbg{position:absolute;inset:0;background:rgba(0,0,20,.5);z-index:40;display:flex;flex-direction:column;justify-content:flex-end;animation:fade .18s}
.sh{background:#fff;max-height:88%;display:flex;flex-direction:column;animation:up .26s cubic-bezier(.2,.8,.2,1)}
.sh-h{display:flex;align-items:center;gap:12px;padding:18px 16px 10px;flex:none}
.sh-h .t{flex:1;min-width:0}
.sh-b{overflow-y:auto;padding:0 0 30px;scrollbar-width:none}
.sh-b::-webkit-scrollbar{display:none}
.toast{position:absolute;left:12px;right:12px;bottom:36px;background:#000;color:#fff;padding:6px 6px 6px 16px;min-height:52px;display:flex;align-items:center;gap:8px;z-index:65;font:500 15px/1.4 var(--f);animation:up .2s}
.toast .grow{flex:1}
.toast button{color:#A9B0FF;font-weight:800;padding:0 12px;height:42px;flex:none}

/* 通知栏 */
.shade{position:absolute;inset:0;z-index:80;background:rgba(0,0,10,.55);animation:fade .2s}
.shade-p{background:#F2F3F8;padding:40px 12px 14px;animation:down .3s cubic-bezier(.2,.8,.2,1)}
.ntf{background:#fff;padding:14px;margin-top:8px}

/* 流程头：半屏巨字 → 角标 */
.fh{position:relative;flex:none;height:384px;background:var(--blue);color:#fff;overflow:hidden;transition:height .5s cubic-bezier(.2,.8,.2,1),background-color .45s}
.fh.ink{background:#000}
.fh.c{height:90px;background:#fff;color:#000;box-shadow:0 1px 0 var(--hair)}
.fh-ch{position:absolute;font-family:var(--han);font-weight:900;line-height:1;color:#fff;z-index:3;transition:left .5s cubic-bezier(.2,.8,.2,1),bottom .5s cubic-bezier(.2,.8,.2,1),font-size .5s cubic-bezier(.2,.8,.2,1);pointer-events:none;white-space:nowrap}
.fh-badge{position:absolute;left:50px;bottom:11px;width:46px;height:46px;background:var(--blue);z-index:2;opacity:0;transform:scale(.3);transform-origin:left bottom;transition:opacity .3s .2s,transform .4s .15s}
.fh.ink .fh-badge{background:#000}
.fh.c .fh-badge{opacity:1;transform:none}
.fh-back{position:absolute;left:4px;top:36px;z-index:4;color:inherit}
.fh.c .fh-back{top:auto;bottom:12px}
.fh-step{position:absolute;right:16px;top:48px;font:700 14px/1 var(--f);z-index:4;color:var(--onblue);transition:opacity .2s}
.fh.c .fh-step{opacity:0}
.fh-t{position:absolute;left:108px;right:12px;bottom:13px;z-index:4;opacity:0;transition:opacity .3s .25s}
.fh.c .fh-t{opacity:1}
.fh-t b{display:block;font:800 18px/1.25 var(--f)}
.fh-t span{display:block;font:400 13px/1.35 var(--f);color:var(--mute)}
.fh-x{position:absolute;right:6px;bottom:12px;z-index:4;opacity:0;transition:opacity .3s}
.fh.c .fh-x{opacity:1}

/* 波形 */
.wv{position:relative}
.wv-reg{position:absolute;top:0;bottom:0;pointer-events:none}
.wv-sel{position:absolute;top:0;bottom:0;background:rgba(43,59,255,.16);box-shadow:inset 2px 0 0 var(--blue),inset -2px 0 0 var(--blue);pointer-events:none}
.wv-sel .hd{position:absolute;top:50%;width:14px;height:34px;margin-top:-17px;background:var(--blue)}
.wv-sel .hd.l{left:-7px}.wv-sel .hd.r{right:-7px}
.wv-ph{position:absolute;top:-4px;bottom:-4px;width:2px;margin-left:-1px;background:var(--blue);pointer-events:none;z-index:3}
.wv-ph::before{content:"";position:absolute;top:0;left:-4px;width:10px;height:10px;background:var(--blue)}
.wv-cut{position:absolute;top:0;bottom:0;background:repeating-linear-gradient(135deg,rgba(43,59,255,.30) 0 3px,rgba(43,59,255,.08) 3px 7px);box-shadow:inset 0 2px 0 var(--blue),inset 0 -2px 0 var(--blue);pointer-events:none}
.wv-mark{position:absolute;top:-6px;bottom:0;width:0;border-left:2px solid #000;pointer-events:none}
.wv-mark b{position:absolute;top:0;left:-1px;font:700 12px/1 var(--f);background:#000;color:#fff;padding:3px 5px;white-space:nowrap}
.ruler{display:flex;justify-content:space-between;font:500 12px/1 var(--f);color:var(--mute);font-variant-numeric:tabular-nums;padding-top:6px}
.numtag{position:absolute;top:-1px;width:20px;height:20px;margin-left:-10px;background:#000;color:#fff;font:800 12px/20px var(--f);text-align:center;z-index:4}
.numtag.b{background:var(--blue)}

/* ---------- 展示板 ---------- */
.bd{width:100%;overflow-x:hidden}
.band{position:relative}
.band.blue{background:var(--blue);color:#fff}
.band.paper{background:#fff;color:#000}
.band.ink{background:#000;color:#fff}
.wrap{max-width:1600px;margin:0 auto;padding:0 64px}
.topline{display:flex;align-items:center;justify-content:space-between;padding:40px 0 0}
.lockup{display:flex;align-items:center;gap:18px}
.lockup .wm{font:900 44px/1 var(--han);letter-spacing:.02em}
.lockup .sub{font:500 15px/1.4 var(--f);color:var(--onblue);margin-top:6px}
.meta{font:600 15px/1.5 var(--f);color:var(--onblue);text-align:right}
.cols{display:flex;justify-content:space-between;align-items:flex-start;gap:48px}
.col{display:flex;flex-direction:column;align-items:flex-start}
.h1{font:900 112px/1.04 var(--han);margin:56px 0 0;letter-spacing:-.01em}
.lead{font:400 20px/1.75 var(--f);max-width:30em;margin:28px 0 0;color:#fff;text-wrap:pretty}
.lead b{font-weight:800}
.slot{margin-top:56px}
.slot.z12 .pf{zoom:1.2}
.plabel{display:flex;align-items:flex-start;gap:12px;margin:0 0 16px;max-width:400px}
.plabel .tx b{display:block;font:800 18px/1.3 var(--f)}
.plabel .tx span{display:block;font:400 15px/1.5 var(--f);opacity:.88;margin-top:2px}
.band.paper .plabel .tx span{color:var(--mute);opacity:1}
.sys{margin-top:64px;width:100%;max-width:500px}
.sys h3{font:900 26px/1.3 var(--han);margin:0 0 6px;text-wrap:balance}
.sys p{font:400 16px/1.7 var(--f);margin:0;color:var(--onblue)}
.anat{display:flex;gap:28px;align-items:flex-start;margin-top:26px}
.anat-k{display:flex;flex-direction:column;gap:16px;padding-top:4px}
.anat-k div{display:flex;gap:10px;font:400 15px/1.5 var(--f)}
.anat-k i{font-style:normal;width:24px;height:24px;flex:none;background:#fff;color:var(--blue);font:800 14px/24px var(--f);text-align:center}
.seq{display:flex;gap:14px;margin-top:30px;align-items:flex-end}
.seq .mini{width:100px;height:200px;background:#fff;position:relative;overflow:hidden;box-shadow:0 0 0 2px rgba(255,255,255,.9)}
.seq figcaption{font:400 14px/1.45 var(--f);margin-top:10px;color:#fff;width:100px}
.swatch{display:flex;gap:0;margin-top:30px;width:100%}
.swatch div{flex:1;height:92px;padding:12px;font:700 14px/1.4 var(--f);display:flex;flex-direction:column;justify-content:flex-end}
.swatch span{font-weight:400;font-variant-numeric:tabular-nums}
.btitle{display:flex;gap:28px;align-items:flex-end;padding:96px 0 0}
.btitle h2{font:900 64px/1.08 var(--han);margin:0}
.btitle p{font:400 18px/1.7 var(--f);margin:12px 0 0;max-width:36em}
.band.paper .btitle p{color:var(--mute)}
.notes{display:flex;flex-direction:column;gap:14px;margin-top:20px;max-width:380px}
.notes div{font:400 15px/1.6 var(--f);padding-left:14px;box-shadow:inset 3px 0 0 currentColor}
.ent{display:flex;align-items:center;gap:14px;width:100%;padding:14px 0;border-top:1px solid rgba(255,255,255,.2);text-align:left}
.ent:hover{background:rgba(255,255,255,.06)}
.ent .tx{flex:1}
.ent .tx b{display:block;font:800 17px/1.35 var(--f)}
.ent .tx span{display:block;font:400 15px/1.5 var(--f);color:rgba(255,255,255,.8)}
.ent .go{font:700 14px/1 var(--f);color:#A9B0FF}
.freebox{margin-top:36px;padding:24px;background:#fff;color:#000}
.freebox h4{font:900 22px/1.3 var(--han);margin:0 0 12px}
.freebox ul{margin:0;padding:0;list-style:none;display:grid;grid-template-columns:1fr 1fr;gap:8px 20px}
.freebox li{font:400 15px/1.5 var(--f);padding-left:16px;position:relative}
.freebox li::before{content:"";position:absolute;left:0;top:.55em;width:8px;height:8px;background:var(--blue)}
.offbtn{margin-top:26px;display:inline-flex;align-items:center;gap:12px;height:48px;padding:0 18px;background:#fff;color:#000;font:800 16px/1 var(--f)}
.offbtn.on{background:var(--blue);color:#fff}

/* 覆盖图 */
.cov-head{display:flex;justify-content:space-between;align-items:flex-end;gap:40px;padding:96px 0 28px}
.cov-head h2{font:900 64px/1.08 var(--han);margin:0}
.cov-head p{font:400 18px/1.7 var(--f);color:var(--mute);margin:12px 0 0;max-width:34em}
.cov-stats{font:900 120px/0.9 var(--f);color:var(--blue);font-variant-numeric:tabular-nums;text-align:right}
.cov-stats span{display:block;font:600 16px/1.4 var(--f);color:#000;margin-top:10px}
.legend{display:flex;flex-wrap:wrap;gap:6px;padding:20px 0 28px;border-top:2px solid #000}
.legend button{display:flex;align-items:center;gap:8px;padding:0 10px 0 0;height:40px;background:var(--tint);font:600 14px/1 var(--f)}
.legend button.on{background:#000;color:#fff}
.legend button em{font-style:normal;color:var(--mute);font-variant-numeric:tabular-nums}
.legend button.on em{color:#BFC4FF}
.legend .clear{background:#fff;box-shadow:inset 0 0 0 2px #000;padding:0 14px}
.covgrid{columns:3 400px;column-gap:40px;padding-bottom:40px}
.cg{break-inside:avoid;margin-bottom:34px}
.cg-h{display:flex;align-items:center;gap:12px;padding-bottom:10px;border-bottom:2px solid #000}
.cg-h b{font:900 22px/1 var(--f);width:36px;height:36px;background:#000;color:#fff;display:inline-flex;align-items:center;justify-content:center}
.cg-h span{font:800 18px/1.3 var(--f);flex:1}
.cg-h em{font:600 14px/1 var(--f);font-style:normal;color:var(--mute)}
.ci{display:grid;grid-template-columns:40px 1fr;gap:2px 10px;width:100%;padding:10px 6px 10px 0;border-bottom:1px solid var(--hair);text-align:left;color:#000}
.ci:hover{background:var(--tint)}
.ci.dim{opacity:.22}
.ci .id{font:800 14px/1.5 var(--f);font-variant-numeric:tabular-nums;color:var(--blue)}
.ci .ft{font:500 15px/1.5 var(--f)}
.ci .wh{grid-column:2;display:flex;align-items:center;gap:8px;font:400 14px/1.45 var(--f);color:var(--mute)}
.ci .wh .han{width:22px;height:22px;font-size:14px}
.honest{display:grid;grid-template-columns:repeat(3,1fr);gap:0;border-top:2px solid #000;margin:10px 0 0}
.honest div{padding:18px 20px 22px 0;font:400 15px/1.6 var(--f)}
.honest b{display:block;font:800 16px/1.4 var(--f);margin-bottom:4px}
.foot{padding:40px 0 56px;font:400 14px/1.6 var(--f);color:var(--mute);border-top:1px solid var(--hair);margin-top:30px}

@media (max-width: 1100px){
  .wrap{padding:0 16px}
  .cols{flex-direction:column;align-items:center;gap:0}
  .col{align-items:center;width:100%}

<script type="text/babel" data-presets="react">
/* ===================== 10 · core ===================== */
const { useState, useEffect, useRef, useMemo, useCallback, useContext, createContext, Fragment } = React;
const SJ = window.SJ;
const fmt = SJ.fmt;
const BLUE = '#2B3BFF', INK = '#000', TINT = '#EDEFFF';
const fmtT = (s, d = 1) => { s = Math.max(0, s); const m = Math.floor(s / 60); const x = s - m * 60; return m + ':' + (x < 10 ? '0' : '') + x.toFixed(d); };
const hashStr = s => { let h = 5381; for (let i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) >>> 0; return h || 1; };
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const pct = (t, a, b) => ((t - a) / (b - a) * 100) + '%';

/* ---------- 包络（全部来自 SJ） ---------- */
function downsample(a, rIn, rOut) { const k = rIn / rOut, n = Math.floor(a.length / k), o = new Float32Array(n); for (let i = 0; i < n; i++) { let m = 0; for (let j = Math.floor(i * k); j < Math.floor((i + 1) * k); j++) if (a[j] > m) m = a[j]; o[i] = m; } return o; }
function cutEnv(a, rate, ranges) { const out = []; for (let i = 0; i < a.length; i++) { const t = i / rate; let skip = false; for (const [s, e] of ranges) if (t >= s && t < e) { skip = true; break; } if (!skip) out.push(a[i]); } return Float32Array.from(out); }
function mapEnv(a, f) { const o = new Float32Array(a.length); for (let i = 0; i < a.length; i++) o[i] = f(a[i], i); return o; }
const PAUSE_CUT = SJ.PAUSES.map(([s, d]) => [s + 0.15, s + d - 0.15]);
const ENV = (() => {
  const speech = SJ.speechEnvelope();
  const music = SJ.musicEnvelope();
  const long = downsample(SJ.speechEnvelope({ seconds: 1120 }), 50, 5);
  return {
    speech, music, long,
    denoised: mapEnv(speech, v => v < 0.075 ? v * 0.2 : v),
    clean: cutEnv(mapEnv(speech, v => v < 0.075 ? v * 0.2 : Math.min(1, v * 1.25)), 50, PAUSE_CUT),
    nopause: cutEnv(speech, 50, PAUSE_CUT),
    planned: cutEnv(mapEnv(speech, v => Math.min(1, v * 1.41)), 50, [[0, 3], ...PAUSE_CUT]),
    tts: SJ.speechEnvelope({ seconds: 9.4, seed: 21, lead: 0.25, pauses: [[4.6, 0.5]], noise: 0.01 }),
    rec: SJ.speechEnvelope({ seconds: 60, seed: 11, lead: 0.6, pauses: [[9.0, 1.4], [21, 1.2], [37, 1.6]], noise: 0.03 }),
    ref: SJ.speechEnvelope({ seconds: 5.2, seed: 33, lead: 0.3, pauses: [], noise: 0.015 }),
    dub: SJ.speechEnvelope({ seconds: 16, seed: 41, lead: 0.8, pauses: [[3.6, 0.4], [7.4, 0.6], [10.2, 0.5], [12.4, 0.6]], noise: 0.01 }),
  };
})();
const TRACK_ENV = {};
function trackEnv(id, seconds, bpm) { if (!TRACK_ENV[id]) TRACK_ENV[id] = SJ.musicEnvelope({ seconds: Math.max(8, Math.min(seconds, 232)), seed: hashStr(id) % 997, bpm: bpm || 96 }); return TRACK_ENV[id]; }

/* ---------- 小图标（只画动作，不画装饰） ---------- */
function Ic({ n, s = 24, c = 'currentColor', w = 2.2 }) {
  const p = { fill: 'none', stroke: c, strokeWidth: w, strokeLinecap: 'square', strokeLinejoin: 'miter' };
  const d = {
    back: <path d="M15 4 7 12l8 8" {...p} />,
    close: <path d="M5 5l14 14M19 5 5 19" {...p} />,
    play: <path d="M7 4.5v15l13-7.5z" fill={c} />,

    undo: <g {...p}><path d="M9 6 4 11l5 5" /><path d="M4.5 11H14a5.5 5.5 0 0 1 0 11h-3" /></g>,
    redo: <g {...p}><path d="m15 6 5 5-5 5" /><path d="M19.5 11H10a5.5 5.5 0 0 0 0 11h3" /></g>,
    search: <g {...p}><circle cx="10.5" cy="10.5" r="6" /><path d="m15 15 5 5" /></g>,

    plus: <path d="M12 4v16M4 12h16" {...p} />,
    minus: <path d="M4 12h16" {...p} />,
    right: <path d="m9 4 8 8-8 8" {...p} />,
    down: <path d="m4 9 8 8 8-8" {...p} />,
    grip: <g fill={c}><rect x="7" y="6" width="3" height="3" /><rect x="14" y="6" width="3" height="3" /><rect x="7" y="11" width="3" height="3" /><rect x="14" y="11" width="3" height="3" /><rect x="7" y="16" width="3" height="3" /><rect x="14" y="16" width="3" height="3" /></g>,
    prev: <g fill={c}><rect x="5" y="5" width="3" height="14" /><path d="M19 5v14L9 12z" /></g>,
    next: <g fill={c}><rect x="16" y="5" width="3" height="14" /><path d="M5 5v14l10-7z" /></g>,
    rec: <rect x="5" y="5" width="14" height="14" fill={c} />,
    lock: <g {...p}><rect x="5" y="10" width="14" height="10" /><path d="M8 10V7a4 4 0 0 1 8 0v3" /></g>,
  }[n];
  return <svg width={s} height={s} viewBox="0 0 24 24" style={{ display: 'block', flex: 'none' }}>{d}</svg>;
}

/* ---------- 汉字方块（标志、图标、入口、角标都是它） ---------- */
function Han({ ch, s = 40, tone = 'blue', cut = false, fs, style, className = '', onClick }) {
  const c = Math.max(4, Math.round(s * 0.22));
  const st = { width: s, height: s, fontSize: fs || Math.round(s * 0.64), ...style };
  if (cut) st.clipPath = `polygon(0 0, calc(100% - ${c}px) 0, 100% ${c}px, 100% 100%, 0 100%)`;
  return <span className={'han han-' + tone + ' ' + className} style={st} onClick={onClick}>{ch}</span>;
}
const Logo = ({ s = 32, tone = 'blue' }) => <Han ch="剪" s={s} tone={tone} cut />;

/* ---------- 波形（canvas；数据来自 SJ 包络） ---------- */
function Wave({ env, rate, from = 0, to, h = 64, color = INK, bar = 2, gap = 1, mirror = true, gain = 1, hi = null, className = '', style, children, onTap }) {
  const cv = useRef(null), box = useRef(null);
  const [w, setW] = useState(0);
  useEffect(() => { const el = box.current; if (!el) return; const ro = new ResizeObserver(() => setW(el.clientWidth)); ro.observe(el); setW(el.clientWidth); return () => ro.disconnect(); }, []);
  const end = to == null ? env.length / rate : to;
  useEffect(() => {
    const c = cv.current; if (!c || !w) return; const S = 3;
    c.width = Math.round(w * S); c.height = Math.round(h * S);
    const g = c.getContext('2d'); g.setTransform(S, 0, 0, S, 0, 0); g.clearRect(0, 0, w, h); g.fillStyle = color;
    const n = Math.max(1, Math.floor((w + gap) / (bar + gap))), span = end - from;
    for (let i = 0; i < n; i++) {
      const t0 = from + span * i / n, t1 = from + span * (i + 1) / n;
      const i0 = Math.max(0, Math.floor(t0 * rate)), i1 = Math.min(env.length, Math.max(i0 + 1, Math.ceil(t1 * rate)));
      let m = 0; for (let k = i0; k < i1; k++) if (env[k] > m) m = env[k];
      if (i0 >= env.length) m = 0;
      m = Math.min(1, m * gain);
      const x = i * (bar + gap);
      g.fillStyle = hi && t0 >= hi[0] && t1 <= hi[1] ? hi[2] : color;
      if (mirror) { const bh = Math.max(1, m * (h - 2)); g.fillRect(x, (h - bh) / 2, bar, bh); }
      else { const bh = Math.max(1, m * (h - 1)); g.fillRect(x, h - bh, bar, bh); }
    }
  }, [w, env, rate, from, end, h, color, bar, gap, mirror, gain, hi && hi.join()]);
  const tap = onTap ? e => { const r = box.current.getBoundingClientRect(); onTap(from + clamp((e.clientX - r.left) / r.width, 0, 1) * (end - from)); } : undefined;
  return <div ref={box} className={'wv ' + className} style={{ height: h, ...style, cursor: onTap ? 'pointer' : undefined }} onClick={tap}>
    <canvas ref={cv} style={{ width: '100%', height: h, display: 'block' }} />
    {children}
  </div>;
}

/* 频谱视图：对数频率轴，颜色只用纸→刃蓝→墨 */
function Spectro({ env, rate, from = 0, to, h = 120 }) {
  const cv = useRef(null), box = useRef(null); const [w, setW] = useState(0);
  useEffect(() => { const el = box.current; const ro = new ResizeObserver(() => setW(el.clientWidth)); ro.observe(el); setW(el.clientWidth); return () => ro.disconnect(); }, []);
  useEffect(() => {
    const c = cv.current; if (!c || !w) return; const S = 2; c.width = w * S; c.height = h * S; const g = c.getContext('2d'); g.setTransform(S, 0, 0, S, 0, 0);
    const r = SJ.rng(5); const cols = Math.floor(w / 2), rows = Math.floor(h / 3);
    for (let i = 0; i < cols; i++) {
      const t = from + (to - from) * i / cols; const a = env[Math.min(env.length - 1, Math.floor(t * rate))] || 0;
      for (let j = 0; j < rows; j++) {
        const f = j / rows; const formant = Math.exp(-Math.pow((f - 0.32) / 0.14, 2)) + 0.6 * Math.exp(-Math.pow((f - 0.58) / 0.1, 2));
        let e = a * (0.35 + formant) * (0.7 + 0.5 * r()) + 0.05 * r(); e = clamp(e, 0, 1);
        g.fillStyle = e < 0.5 ? `rgba(43,59,255,${(e * 2).toFixed(3)})` : `rgb(${Math.round(43 * (2 - e * 2))},${Math.round(59 * (2 - e * 2))},${Math.round(255 * (2 - e * 2))})`;
        g.fillRect(i * 2, h - (j + 1) * 3, 2, 3);
      }
    }
  }, [w, env, from, to, h]);
  return <div ref={box} style={{ height: h, position: 'relative' }}><canvas ref={cv} style={{ width: '100%', height: h, display: 'block' }} /></div>;
}

/* ---------- 音乐封面：按曲目 id 固定随机种子，曲名第一个字裁进方块 ---------- */
function Cover({ id, title, size = 56 }) {
  const r = SJ.rng(hashStr(id));
  const tones = [[BLUE, '#fff'], [INK, '#fff'], [TINT, BLUE], [INK, BLUE], ['#fff', INK]];
  const [bg, fg] = tones[Math.floor(r() * tones.length)];
  const ch = title.replace(/[（(].*$/, '').replace(/^[^\u4e00-\u9fa5]+/, '')[0] || title[0];
  const k = Math.floor(r() * 3);
  const fs = size * [0.98, 1.16, 1.3][k], x = size * [0.16, -0.05, 0.22][k], y = size * [0.97, 1.0, 1.14][k];
  return <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`} style={{ display: 'block', flex: 'none' }}>
    <rect width={size} height={size} fill={bg} stroke={bg === '#fff' ? 'rgba(0,0,0,.2)' : 'none'} />
    <text x={x} y={y} fontSize={fs} fontWeight="900" fontFamily={'"Noto Sans SC","Noto Sans CJK SC",sans-serif'} fill={fg}>{ch}</text>
  </svg>;
}

/* ---------- 声纹：音色的数据图形，不画人脸 ---------- */
function VoicePrint({ id, size = 56, tone = 'ink' }) {
  const r = SJ.rng(hashStr(id)); const n = 13, centre = 0.2 + r() * 0.6, width = 0.12 + r() * 0.2;
  const bg = tone === 'ink' ? INK : tone === 'blue' ? BLUE : TINT, fg = tone === 'tint' ? BLUE : '#fff';
  const bw = size / (n * 1.75), step = (size - bw * 2) / n;
  return <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`} style={{ display: 'block', flex: 'none' }}>
    <rect width={size} height={size} fill={bg} />
    {Array.from({ length: n }, (_, i) => { const f = i / (n - 1); const v = 0.14 + 0.86 * Math.exp(-Math.pow((f - centre) / width, 2)) * (0.6 + 0.4 * r()); const hh = v * size * 0.72; return <rect key={i} x={bw + i * step} y={(size - hh) / 2} width={bw} height={hh} fill={fg} />; })}
  </svg>;
}

/* ---------- 小控件 ---------- */
function Seg({ opts, value, onChange, style }) {
  return <div className="seg" style={style}>{opts.map(o => { const v = typeof o === 'string' ? o : o.v, l = typeof o === 'string' ? o : o.l; return <button key={v} className={value === v ? 'on' : ''} onClick={() => onChange(v)}>{l}</button>; })}</div>;
}
const Tog = ({ on, onChange }) => <button className={'tog' + (on ? ' on' : '')} onClick={e => { e.stopPropagation(); onChange(!on); }} aria-pressed={on}><i /></button>;
const Check = ({ on }) => <span className={'check' + (on ? ' on' : '')}>{on && <Ic n="check" s={18} w={2.6} />}</span>;
const Radio = ({ on }) => <span className={'radio' + (on ? ' on' : '')} />;
function Slider({ v, min = 0, max = 1, onChange, fmtv }) {
  const ref = useRef(null);
  const set = e => { const r = ref.current.getBoundingClientRect(); onChange(min + clamp((e.clientX - r.left) / r.width, 0, 1) * (max - min)); };
  const p = (v - min) / (max - min) * 100;
  return <div className="slider" ref={ref} onClick={set}><div className="tr" /><div className="fi" style={{ width: p + '%' }} /><div className="kn" style={{ left: p + '%' }} /></div>;
}
function Sheet({ title, sub, han, onClose, children, foot }) {
  return <div className="shbg" onClick={onClose}><div className="sh" onClick={e => e.stopPropagation()}>
    <div className="sh-h">{han}<div className="t"><div className="pt2">{title}</div>{sub && <div className="psub" style={{ marginTop: 2 }}>{sub}</div>}</div><button className="pib" onClick={onClose} aria-label="关闭"><Ic n="close" /></button></div>
    <div className="sh-b">{children}</div>
    {foot && <div className="pfoot" style={{ paddingBottom: 30 }}>{foot}</div>}
  </div></div>;
}
function Prog({ p }) { return <div className="bar-prog"><i style={{ width: (p * 100).toFixed(1) + '%' }} /></div>; }
function PlayBtn({ on, onClick, s = 44, tone = 'blue' }) {

/* ---------- 每台手机自己的播放器（预览互斥） ---------- */
function usePlayerState() {
  const [cur, setCur] = useState(null);
  const [t, setT] = useState(0);
  useEffect(() => {
    if (!cur || cur.frozen) return; let raf, last = 0;
    const tick = now => {
      const tt = cur.from + (now - cur.start) / 1000 * cur.speed;
      if (tt >= cur.from + cur.dur) { setCur(null); setT(0); return; }
      if (now - last > 45) { setT(tt); last = now; }
      raf = requestAnimationFrame(tick);
    };
    raf = requestAnimationFrame(tick); return () => cancelAnimationFrame(raf);
  }, [cur]);
  return useMemo(() => ({
    key: cur && cur.key, t: cur ? t : 0, from: cur ? cur.from : 0, dur: cur ? cur.dur : 0,
    play: (key, dur, from = 0, speed = 1) => { setT(from); setCur({ key, dur, from, speed, start: performance.now() }); },
    freeze: (key, dur, from, at) => { setT(at); setCur({ key, dur, from, speed: 1, frozen: true }); },
    stop: () => setCur(null),
    on: k => !!cur && cur.key === k,
    toggle(key, dur, from = 0, speed = 1) { if (cur && cur.key === key) setCur(null); else { setT(from); setCur({ key, dur, from, speed, start: performance.now() }); } },
    frac() { return cur ? clamp((t - cur.from) / cur.dur, 0, 1) : 0; },
  }), [cur, t]);
}

/* ---------- 首屏：先听一个结果（一首歌 → 30 秒铃声） ---------- */
function DemoStrip() {
  const C = SJ.CHORUS[0]; const [t, setT] = useState(null);
  useEffect(() => { if (t == null) return; const st = performance.now() - (t - C.from) * 1000; let raf; const f = n => { const v = C.from + (n - st) / 1000; if (v >= C.to) { setT(null); return; } setT(v); raf = requestAnimationFrame(f); }; raf = requestAnimationFrame(f); return () => cancelAnimationFrame(raf); }, [t == null]);
  return <div className="demo">
    <div className="demo-h"><button className="demo-play" onClick={() => setT(t == null ? C.from : null)} aria-label="试听"><Ic n={t == null ? 'play' : 'stop'} s={30} /></button>
      <div><b>先听一个结果</b><span>一首 3 分 52 秒的歌，「铃」自己找到副歌，剪成 30 秒来电铃声，最后一秒淡出。</span></div></div>
    <div className="demo-w">
      <Wave env={ENV.music} rate={20} h={84} bar={2} gap={2} color="rgba(255,255,255,.42)" hi={[C.from, C.to, '#fff']} />
      <div className="demo-box" style={{ left: pct(C.from, 0, 232), width: pct(C.to - C.from, 0, 232) }}><b>2:05 – 2:35　来电铃声</b></div>
      {t != null && <div className="demo-ph" style={{ left: pct(t, 0, 232) }} />}
    </div>
    <div className="demo-secs">{SJ.SECTIONS.map((s, i) => <span key={i} style={{ width: pct(s.to - s.from, 0, 232) }}>{s.name === '副歌' ? '副歌' : ''}</span>)}</div>
    <div className="ruler"><span>0:00</span><span>1:00</span><span>2:00</span><span>3:00</span><span>3:52</span></div>

}
