<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>声剪 方向一</title>
<!--
  声剪 · 商业化重新设计 · 方向 1「说一句，落在声音上」
  设计系统
  - 界面：冷白（#F4F6F8 / #FFFFFF）与石墨（#1E2228），其余全部中性。
  - 颜色只回答一个问题：这处改动来自你说的哪几个字。四支荧光笔（黄、粉、绿、蓝，第五支橙备用）
    只给「原句短语 ↔ 步骤卡 ↔ 波形区域」用；选区、播放头、按钮、会员标记一律石墨。
  - 字：中文 Noto Sans SC（本机回退 Noto Sans CJK SC），拉丁与数字 Red Hat Display / Red Hat Text，
    时间一律等宽数字（tabular-nums），不用等宽字体。用户说的那句话是全屏最大的字。
  - 源码分块在 dir-1/parts/，build.sh 拼成本文件。
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&family=Red+Hat+Display:wght@500;700;900&family=Red+Hat+Text:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --f-ui: "Red Hat Text", "Noto Sans SC", "Noto Sans CJK SC", "Droid Sans Fallback", sans-serif;
  --f-num: "Red Hat Display", "Noto Sans SC", "Noto Sans CJK SC", sans-serif;
  --f-big: "Red Hat Display", "Noto Sans SC", "Noto Sans CJK SC", sans-serif;
  --board: #E8ECF0;
  --board-ink: #1E2228;
  --board-ink-2: #434A54;
  --board-ink-3: #5A626D;
  --board-line: #C9D0D8;
  font-synthesis: none;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--board); color: var(--board-ink);
  font-family: var(--f-ui); font-size: 16px; line-height: 1.6;
  line-break: strict; overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-align: inherit; }
input, textarea { font: inherit; color: inherit; }
.num { font-family: var(--f-num); font-variant-numeric: tabular-nums; }

/* ---------------- board ---------------- */
.board { max-width: 1600px; margin: 0 auto; padding: 40px 48px 80px; position: relative; }
.bd-top { display: flex; align-items: center; justify-content: space-between; gap: 24px; }
.bd-brand { display: flex; align-items: center; gap: 14px; }
.bd-brand b { font-size: 34px; font-weight: 900; letter-spacing: 0.02em; }
.bd-brand span { font-size: 15px; color: var(--board-ink-3); }
.bd-meta { font-size: 15px; color: var(--board-ink-3); text-align: right; }
.bd-hero { display: grid; grid-template-columns: minmax(0, 456px) minmax(0, 1fr); gap: 52px; margin-top: 30px; align-items: start; }
.bd-h1 { font-family: var(--f-big); font-size: 48px; line-height: 1.22; font-weight: 900; margin: 0; letter-spacing: 0; }
.bd-lead { font-size: 17px; line-height: 1.8; color: var(--board-ink-2); margin: 20px 0 0; text-wrap: pretty; }
.row-note { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(3, 380px); justify-content: space-between; align-items: start; margin: 10px 0 -30px; }
.row-note h3 { margin: 0 0 12px; font-family: var(--f-big); font-size: 26px; font-weight: 900; line-height: 1.35; }
.row-note div { font-size: 16px; line-height: 1.7; color: var(--board-ink-2); padding-left: 46px; }
.row-note b { display: block; color: var(--board-ink); font-size: 17px; }
.bd-rule { margin-top: 24px; padding-top: 16px; border-top: 1px solid var(--board-line); font-size: 15px; line-height: 1.7; color: var(--board-ink-3); }
.bd-swatches { display: flex; gap: 8px; margin: 10px 0 4px; align-items: center; flex-wrap: wrap; }
.bd-swatches i { width: 40px; height: 14px; border-radius: 7px; display: inline-block; }

.cu { position: relative; min-width: 0; overflow: hidden; background: #FFFFFF; border-radius: 30px; padding: 26px 34px 22px; }
.cu-cap { font-size: 15px; color: var(--board-ink-3); display: flex; justify-content: space-between; gap: 16px; }
.cu-row { word-break: keep-all; font-family: var(--f-big); font-size: 56px; font-weight: 700; line-height: 1.3; color: var(--board-ink); position: relative; z-index: 2; white-space: nowrap; }
.cu-row.r1 { margin-top: 0; }
.cu-wave { position: relative; margin: 34px 0 34px; z-index: 1; }
.cu-lines { position: absolute; inset: 0; pointer-events: none; z-index: 1; overflow: visible; }
.cu-lab { position: absolute; font-size: 14px; color: var(--board-ink-2); white-space: nowrap; line-height: 1.3; }
.cu-foot { margin-top: 18px; display: flex; gap: 28px; flex-wrap: wrap; font-size: 15px; color: var(--board-ink-2); }
.cu-foot span { display: inline-flex; align-items: center; gap: 8px; }

.bd-sec { margin-top: 64px; }
.bd-sec.first { margin-top: 44px; }
.bd-h2 { font-family: var(--f-big); font-size: 36px; font-weight: 900; line-height: 1.2; margin: 0; }
.bd-sub { font-size: 17px; color: var(--board-ink-2); margin: 8px 0 0; max-width: 64em; }
.sec-head { display: grid; grid-template-columns: auto 1fr; gap: 10px 40px; align-items: end; }
.sec-head .bd-sub { margin: 0 0 4px; max-width: 46em; }

.flow { position: relative; margin-top: 26px; }
.flow-grid { display: grid; grid-template-columns: repeat(3, 380px); justify-content: space-between; row-gap: 120px; position: relative; z-index: 2; }
.slot { position: relative; }
.slot-lab { height: 76px; display: flex; gap: 12px; align-items: flex-start; }
.slot-n { flex: none; width: 34px; height: 34px; border-radius: 17px; background: var(--board-ink); color: #fff; font-family: var(--f-num); font-weight: 700; font-size: 17px; display: grid; place-items: center; margin-top: 2px; }
.slot-t { font-size: 20px; font-weight: 700; line-height: 1.3; }
.slot-d { font-size: 15px; color: var(--board-ink-3); line-height: 1.45; margin-top: 2px; text-wrap: balance; }
.flow-svg { position: absolute; inset: 0; z-index: 3; pointer-events: none; overflow: visible; }
.flow-tag { position: absolute; z-index: 4; background: var(--board); padding: 4px 10px; border-radius: 12px; font-size: 14px; color: var(--board-ink-2); white-space: nowrap; line-height: 1.35; border: 1px solid var(--board-line); transform: translate(-50%, -50%); }
.flash { animation: flash 1.6s ease-out 1; }
@keyframes flash { 0% { box-shadow: 0 0 0 0 rgba(30,34,40,.0); } 15% { box-shadow: 0 0 0 10px rgba(30,34,40,.35); } 100% { box-shadow: 0 0 0 26px rgba(30,34,40,0); } }

/* coverage map */
.cov-waffle { display: flex; flex-wrap: wrap; gap: 26px 34px; margin-top: 28px; align-items: flex-start; }
.cw-h { display: flex; align-items: baseline; gap: 8px; font-size: 17px; font-weight: 700; margin-bottom: 8px; }
.cw-h i { font-style: normal; width: 22px; height: 22px; border-radius: 11px; background: var(--board-ink); color: #fff; font-size: 13px; display: inline-grid; place-items: center; font-family: var(--f-num); align-self: center; }
.cw-h span { font-size: 15px; font-weight: 500; color: var(--board-ink-3); }
.cw-sq { display: grid; grid-template-columns: repeat(var(--n), 42px); gap: 5px; }
.cw-sq button { width: 42px; height: 42px; border-radius: 10px; background: #fff; font-family: var(--f-num); font-variant-numeric: tabular-nums; font-size: 14px; font-weight: 700; color: var(--board-ink); display: grid; place-items: center; text-align: center; transition: background .12s; }
.cw-sq button:hover, .cw-sq button.on { background: var(--board-ink); color: #fff; }
.cw-sq button.off { background: transparent; box-shadow: inset 0 0 0 1px var(--board-line); }
.cw-read { margin-top: 18px; min-height: 30px; font-size: 16px; display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: baseline; color: var(--board-ink); }
.cw-read b { font-size: 16px; }
.cw-read span { color: var(--board-ink-3); }
.cov-bar { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 40px; align-items: center; padding-top: 24px; border-top: 1px solid var(--board-line); }
.cov-pill { height: 40px; padding: 0 16px; border-radius: 20px; background: #fff; font-size: 15px; display: inline-flex; align-items: center; gap: 8px; border: 1px solid transparent; }
.cov-pill .num { color: var(--board-ink-3); }
.cov-pill.on { background: var(--board-ink); color: #fff; }
.cov-pill.on .num { color: #C9D0D8; }
.cov-cols { column-count: 3; column-gap: 40px; margin-top: 30px; }
.cov-g { break-inside: avoid; margin-bottom: 34px; border-top: 2px solid var(--board-ink); padding-top: 12px; }
.cov-gh { display: flex; align-items: baseline; gap: 12px; padding-bottom: 8px; }
.cov-gh b { font-family: var(--f-big); font-size: 30px; font-weight: 900; line-height: 1; }
.cov-gh span { font-size: 18px; font-weight: 700; }
.cov-gh em { margin-left: auto; font-style: normal; font-size: 14px; color: var(--board-ink-3); }
.cov-it { display: grid; grid-template-columns: 40px 1fr; gap: 4px 10px; padding: 9px 0; border-top: 1px solid #D3D9DF; }
.cov-it .id { font-family: var(--f-num); font-variant-numeric: tabular-nums; font-size: 14px; color: var(--board-ink-3); padding-top: 2px; }
.cov-it .nm { font-size: 15px; line-height: 1.55; color: var(--board-ink); }
.cov-it .wh { grid-column: 2; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.cov-go { font-size: 14px; line-height: 1.3; padding: 5px 10px; border-radius: 8px; background: #FFFFFF; color: var(--board-ink); }
.cov-go:hover { background: var(--board-ink); color: #fff; }
.cov-go.dim { opacity: 1; background: transparent; padding-left: 0; color: var(--board-ink-3); cursor: default; }
.cov-g.fade .cov-it:not(.hit) { opacity: .28; }
.cov-honest { margin-top: 12px; background: #fff; border-radius: 22px; padding: 24px 26px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px 36px; }
.cov-honest h3 { grid-column: 1 / -1; margin: 0; font-size: 20px; }
.cov-honest div { font-size: 15px; line-height: 1.6; color: var(--board-ink-2); }
.cov-honest b { display: block; color: var(--board-ink); font-size: 16px; margin-bottom: 2px; }
.bd-foot { margin-top: 72px; font-size: 15px; color: var(--board-ink-3); line-height: 1.8; border-top: 1px solid var(--board-line); padding-top: 20px; }

/* ---------------- phone frame ---------------- */
.ph { width: 380px; height: 800px; padding: 10px; border-radius: 46px; background: #1D2126; position: relative;
  box-shadow: 0 0 0 1.5px #2E343C, 0 34px 60px -28px rgba(25, 35, 50, .55); flex: none; }
.ph-scr { position: relative; width: 360px; height: 780px; border-radius: 36px; overflow: hidden; background: var(--bg); color: var(--ink);
  font-family: var(--f-ui); font-size: 16px; line-height: 1.5; isolation: isolate; }
.ph-sb { position: absolute; top: 0; left: 0; right: 0; height: 32px; display: flex; align-items: center; justify-content: space-between; padding: 0 22px 0 24px; font-size: 14px; font-weight: 500; z-index: 40; cursor: pointer; color: var(--ink); font-family: var(--f-num); }
.ph-sb-i { display: flex; align-items: center; gap: 6px; }
.ph-sb-i small { font-size: 12px; font-weight: 700; }
.ph-hole { position: absolute; top: 9px; left: 50%; width: 14px; height: 14px; margin-left: -7px; border-radius: 50%; background: #0A0C0F; z-index: 41; }
.ph-body { position: absolute; top: 32px; left: 0; right: 0; bottom: 24px; }
.ph-gb { position: absolute; bottom: 0; left: 0; right: 0; height: 24px; display: grid; place-items: center; z-index: 40; }
.ph-gb i { width: 108px; height: 4px; border-radius: 2px; background: var(--ink); opacity: .5; display: block; }

/* tokens: light */
.ph { --bg: #F4F6F8; --surface: #FFFFFF; --surface-2: #E9EDF1; --surface-3: #DDE2E8; --ink: #1E2228; --ink-2: #434A54; --ink-3: #5C6470;
  --line: #DCE1E6; --wave: #2A2F37; --wave-dim: #B3BAC3; --scrim: rgba(20, 24, 30, .42); --on-ink: #FFFFFF; --sel: rgba(30, 34, 40, .1);
  --hl1: #FFE14A; --hl2: #FF9FCC; --hl3: #97E283; --hl4: #94CDFF; --hl5: #FFB66E;
  --hl1i: #6B5400; --hl2i: #A01F5D; --hl3i: #256A1B; --hl4i: #1B5A9A; --hl5i: #964806; }
.ph.dark { --bg: #14171B; --surface: #1C2026; --surface-2: #272C33; --surface-3: #323841; --ink: #ECEFF2; --ink-2: #C6CCD3; --ink-3: #A0A8B2;
  --line: #313740; --wave: #DCE1E6; --wave-dim: #555D67; --scrim: rgba(0, 0, 0, .55); --on-ink: #14171B; --sel: rgba(236, 239, 242, .12);
  --hl1i: #FFE14A; --hl2i: #FF9FCC; --hl3i: #97E283; --hl4i: #94CDFF; --hl5i: #FFB66E; }

/* ---------------- app atoms ---------------- */
.scr { position: absolute; inset: 0; display: flex; flex-direction: column; background: var(--bg); }
.scr.enter { animation: scrIn .2s ease-out; }
@keyframes scrIn { from { transform: translateX(18px); opacity: .4; } to { transform: none; opacity: 1; } }
.top { height: 56px; flex: none; display: flex; align-items: center; gap: 4px; padding: 0 8px 0 6px; }
.top-t { font-size: 19px; font-weight: 700; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-left: 4px; }
.top-t small { display: block; font-size: 13px; font-weight: 400; color: var(--ink-3); line-height: 1.2; overflow: hidden; text-overflow: ellipsis; }
.scroll { flex: 1; overflow-y: auto; overflow-x: hidden; scrollbar-width: none; position: relative; }
.scroll::-webkit-scrollbar { display: none; }
.pad { padding: 0 16px; }
.ib { width: 44px; height: 44px; border-radius: 22px; display: grid; place-items: center; flex: none; color: var(--ink); }
.ib:hover { background: var(--surface-2); }
.ib.fill { background: var(--ink); color: var(--on-ink); }
.ib.soft { background: var(--surface-2); }
.btn { height: 50px; border-radius: 25px; padding: 0 22px; font-size: 16px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; gap: 8px; white-space: nowrap; }
.btn-p { background: var(--ink); color: var(--on-ink); }
.btn-s { background: var(--surface-2); color: var(--ink); }
.btn-o { background: transparent; color: var(--ink); box-shadow: inset 0 0 0 1.5px var(--ink); }
.btn-t { height: 44px; padding: 0 12px; font-size: 15px; font-weight: 700; display: inline-flex; align-items: center; gap: 6px; color: var(--ink); border-radius: 22px; }
.btn-t:hover { background: var(--surface-2); }
.btn.wide { width: 100%; }
.chip { height: 38px; padding: 0 15px; border-radius: 19px; background: var(--surface-2); font-size: 15px; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; flex: none; color: var(--ink); }
.chip.on { background: var(--ink); color: var(--on-ink); }
.chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding: 0 16px; }
.chips::-webkit-scrollbar { display: none; }
.seg { display: flex; background: var(--surface-2); border-radius: 14px; padding: 3px; gap: 2px; }
.seg button { text-align: center; flex: 1; height: 40px; border-radius: 11px; font-size: 15px; font-weight: 500; color: var(--ink-2); white-space: nowrap; padding: 0 6px; }
.seg button.on { background: var(--surface); color: var(--ink); font-weight: 700; box-shadow: 0 1px 2px rgba(20,25,30,.12); }
.ph.dark .seg button.on { background: var(--surface-3); }
.lbl { font-size: 14px; color: var(--ink-3); }
.h3 { font-size: 17px; font-weight: 700; }
.sec-h { display: flex; align-items: baseline; justify-content: space-between; padding: 0 16px; margin: 22px 0 8px; }
.sec-h b { font-size: 18px; font-weight: 700; }
.sec-h span { font-size: 14px; color: var(--ink-3); }
.row { display: flex; align-items: center; gap: 12px; padding: 12px 16px; min-height: 56px; width: 100%; }
.row:hover { background: var(--surface-2); }
.row-m { flex: 1; min-width: 0; }
.row-t { display: block; font-size: 16px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row-d { display: block; font-size: 14px; color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.badge { font-size: 12px; font-weight: 700; line-height: 1; padding: 4px 7px; border-radius: 6px; box-shadow: inset 0 0 0 1.2px currentColor; color: var(--ink-2); white-space: nowrap; flex: none; }
.badge.solid { background: var(--ink); color: var(--on-ink); box-shadow: none; }
.panel { background: var(--surface); border-radius: 20px; }
.hr { height: 1px; background: var(--line); margin: 0 16px; }
.sw { width: 52px; height: 32px; border-radius: 16px; background: var(--surface-3); position: relative; flex: none; transition: background .15s; }
.sw::after { content: ""; position: absolute; top: 4px; left: 4px; width: 24px; height: 24px; border-radius: 12px; background: var(--surface); transition: left .15s; box-shadow: 0 1px 2px rgba(0,0,0,.2); }
.sw.on { background: var(--ink); }
.sw.on::after { left: 24px; background: var(--on-ink); }
.ck { width: 26px; height: 26px; border-radius: 8px; box-shadow: inset 0 0 0 2px var(--ink-3); display: grid; place-items: center; flex: none; color: var(--on-ink); }
.ck.on { background: var(--ink); box-shadow: none; }
.radio { width: 24px; height: 24px; border-radius: 12px; box-shadow: inset 0 0 0 2px var(--ink-3); flex: none; display: grid; place-items: center; }
.radio.on { box-shadow: inset 0 0 0 2px var(--ink); }
.radio.on::after { content: ""; width: 12px; height: 12px; border-radius: 6px; background: var(--ink); }
.field { background: var(--surface); border-radius: 14px; padding: 10px 14px; box-shadow: inset 0 0 0 1px var(--line); }
.field small { display: block; font-size: 13px; color: var(--ink-3); }
.bar { height: 6px; border-radius: 3px; background: var(--surface-3); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--ink); border-radius: 3px; }
.slider { position: relative; height: 32px; display: flex; align-items: center; cursor: pointer; }
.slider .tr { position: absolute; left: 0; right: 0; height: 6px; border-radius: 3px; background: var(--surface-3); }
.slider .fi { position: absolute; left: 0; height: 6px; border-radius: 3px; background: var(--ink); }
.slider .kn { position: absolute; width: 24px; height: 24px; border-radius: 12px; background: var(--surface); box-shadow: 0 0 0 2px var(--ink), 0 2px 4px rgba(0,0,0,.15); margin-left: -12px; }
.bnav { height: 64px; flex: none; display: flex; background: var(--surface); box-shadow: 0 -1px 0 var(--line); }
.bnav button { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 13px; font-weight: 500; color: var(--ink-3); }
.bnav button.on { color: var(--ink); font-weight: 700; }
.bnav .plus { width: 46px; height: 32px; border-radius: 16px; background: var(--ink); color: var(--on-ink); display: grid; place-items: center; }
.bot { flex: none; padding: 12px 16px 14px; background: var(--bg); box-shadow: 0 -1px 0 var(--line); }
.sheet-bg { position: absolute; inset: 0; background: var(--scrim); z-index: 30; animation: fadeIn .18s ease-out; }
.sheet { position: absolute; left: 0; right: 0; bottom: 0; z-index: 31; background: var(--surface); border-radius: 26px 26px 0 0; max-height: 90%; display: flex; flex-direction: column; animation: sheetIn .22s ease-out; }
.sheet-grip { width: 40px; height: 4px; border-radius: 2px; background: var(--surface-3); margin: 10px auto 4px; flex: none; }
.sheet-h { padding: 8px 20px 4px; font-size: 19px; font-weight: 700; flex: none; display: flex; align-items: center; gap: 8px; }
.sheet-b { overflow-y: auto; scrollbar-width: none; padding: 6px 0 18px; }
.sheet-b::-webkit-scrollbar { display: none; }
@keyframes fadeIn { from { opacity: 0; } }
@keyframes sheetIn { from { transform: translateY(40px); opacity: .3; } }
.toast { position: absolute; left: 16px; right: 16px; bottom: 86px; z-index: 50; background: var(--ink); color: var(--on-ink); border-radius: 16px; padding: 13px 16px; font-size: 15px; display: flex; align-items: center; gap: 10px; animation: sheetIn .2s ease-out; }
.toast button { margin-left: auto; font-weight: 700; text-decoration: underline; text-underline-offset: 3px; }

/* highlighter */
.hl { background-image: linear-gradient(100deg, transparent .1em, var(--c) .26em, var(--c) calc(100% - .26em), transparent calc(100% - .1em));
  background-repeat: no-repeat; background-size: 100% 70%; background-position: 0 78%;
  -webkit-box-decoration-break: clone; box-decoration-break: clone; padding: 0 .14em; margin: 0 -.04em; border-radius: .12em; cursor: pointer; color: var(--ink); }
.ph.dark .hl { color: #1E2228; }
.hl.off { --c: var(--surface-3); text-decoration: line-through; text-decoration-thickness: 2px; color: var(--ink-3); }
.hl.ask { background-image: none; box-shadow: inset 0 -.18em 0 var(--c); border-bottom: 2px dashed var(--ink-3); }
.hl.foc { text-decoration: underline; text-decoration-thickness: 3px; text-underline-offset: .22em; text-decoration-color: var(--ink); }
.dot { width: 12px; height: 12px; border-radius: 6px; display: inline-block; flex: none; }
.sep { display: inline-block; width: 4px; height: 4px; border-radius: 2px; background: currentColor; opacity: .55; vertical-align: middle; margin: 0 .5em 0.15em; }
.mute { color: var(--ink-3); }
.ell { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

@keyframes blink { 50% { opacity: 0; } }
